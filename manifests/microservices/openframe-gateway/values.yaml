global:
  image:
    tag: latest

deployment:
  oss:
    ingress:
      localhost:
        enabled: true   # Enable localhost ingress with nginx
      ngrok:
        enabled: false  # Enable ngrok ingress for external access
        credentials:
          apiKey: ""
          authtoken: ""
      tailnet:
        enabled: false  # Enable Tailscale MagicDNS ingress with nginx + tailscale-issued TLS
        url: ""         # e.g. openframe-nyc1.tail1293d8.ts.net
        tls:
          secretName: tailnet-tls  # K8s TLS Secret in the gateway's namespace, populated out-of-band from `tailscale cert`
    repository:
      baseDir: manifests
      appsDir: apps
      URL: https://github.com/flamingo-stack/openframe-oss-tenant.git
      branch: main
      autoSync: true

registerJob:
  enabled: true
  image:
    registry: ghcr.io/flamingo-stack/registry
    repository: curlimages/curl
    tag: "8.9.1"

initImage:
  registry: ghcr.io/flamingo-stack/registry
  repository: curlimages/curl
  tag: "8.9.1"

image:
  registry: ghcr.io/flamingo-stack/openframe-oss-tenant
  repository: openframe-gateway
  tag: ""

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

podAnnotations:
  loki.grafana.com/scrape: "true"
  prometheus.io/scrape: "true"
