apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tactical-nats
spec:
  serviceName: tactical-nats
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: tactical-nats
  template:
    metadata:
      labels:
        app: tactical-nats
      {{- with .Values.tactical.base.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      priorityClassName: tactical-rmm

      initContainers:
      - name: wait-for-redis
        image: {{ .Values.tactical.base.waitRedisImage.registry }}/{{ .Values.tactical.base.waitRedisImage.repository }}:{{ .Values.tactical.base.waitRedisImage.tag }}
        command: ['sh', '-c', '
          echo "Waiting for Redis..." &&
          until redis-cli -h $REDIS_HOST -p 6379 get "tactical_nats_rmm_conf" > /dev/null; do sleep 2; done &&
          until redis-cli -h $REDIS_HOST -p 6379 get "tactical_nats_api_conf" > /dev/null; do sleep 2; done &&
          echo "Redis is ready!"
          ']
        envFrom:
        - configMapRef:
            name: tactical-default
        - configMapRef:
            name: tactical-postgres
        - configMapRef:
            name: tactical-redis
        - secretRef:
            name: tactical-postgres

      - name: wait-for-backend
        image: {{ .Values.tactical.base.waitPostgresImage.registry }}/{{ .Values.tactical.base.waitPostgresImage.repository }}:{{ .Values.tactical.base.waitPostgresImage.tag }}
        command:
        - sh
        - -c
        - |
          echo "Checking PostgreSQL connection..." &&
          until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT; do
            echo "Waiting for PostgreSQL to accept connections...";
            sleep 2;
          done &&
          echo "PostgreSQL is accepting connections!" &&
          echo "Verifying PostgreSQL query execution..." &&
          until PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -c "SELECT 1;" > /dev/null 2>&1; do
            echo "Waiting for PostgreSQL to execute queries...";
            sleep 2;
          done &&
          echo "PostgreSQL is fully operational!" &&
          echo "Waiting for Backend port..." &&
          HOST_IP=$(echo $API_HOST | cut -d':' -f1) &&
          HOST_PORT=$(echo $API_HOST | cut -d':' -f2) &&
          until nc -z $HOST_IP $HOST_PORT; do
            echo "Waiting for backend port to be ready...";
            sleep 2;
          done &&
          echo "Backend port is ready!" &&
          echo "Checking Backend health endpoint..." &&
          # Probe via the short tactical-backend service name. The pod-FQDN form in
          # $API_HOST is not present in the backend's Django ALLOWED_HOSTS, so a
          # Host: pod-FQDN:8000 request gets a 400 Bad Request and the probe loops
          # forever even though Django is actually serving. The short name is what
          # the backend itself bakes into ALLOWED_HOSTS.
          until wget -q --spider ${TRMM_PROTO}://tactical-backend:${TACTICAL_BACKEND_PORT} 2>/dev/null; do
            echo "Waiting for backend health endpoint...";
            sleep 2;
          done &&
          echo "Backend is fully ready!"
        envFrom:
        - configMapRef:
            name: tactical-default
        - configMapRef:
            name: tactical-postgres
        - configMapRef:
            name: tactical-redis
        - secretRef:
            name: tactical-postgres

      # The main tactical-nats container's entrypoint waits up to 5 min for
      # /opt/tactical/nats-rmm.conf to land on the PVC, then exits if it
      # didn't. Upstream's intended bootstrap path (`nats-api -bootstrap`
      # writes the file before nats-server starts) is not implemented in
      # the 0.0.23 nats-api binary, and tactical-backend's `reload_nats`
      # only writes the config locally when running standalone — in K8s it
      # publishes on the `trmm.nats.reload` subject, which nobody can
      # receive until nats-server is up, which is a chicken-and-egg.
      #
      # nats-api in 0.0.23 ALSO unconditionally starts the auth callout
      # subscriber on $SYS.REQ.USER.AUTH (see flamingo-stack/tacticalrmm
      # nats-listener/svc.go:Svc — there is no AUTH_CALLOUT=false toggle).
      # That means the broker config below MUST set up the AUTH account and
      # the auth_callout block, or supervisord's nats-api enters FATAL with
      # "AUTH_TARGET_ACCOUNT must be set when auth callout is enabled".
      #
      # This init container writes a static nats-server config matching the
      # canonical Layer 3 auth-callout layout from nats-listener's design
      # doc: AUTH/TRMM/SYS accounts, auth-service user inside AUTH, and the
      # auth_callout block pointing at the same NKey issuer the nats-api
      # binary signs UserClaims with. The seed + service password live in
      # the `tactical-nats-auth` Secret (generated once on cluster bootstrap
      # — see STA-3228). On every restart, the init rewrites the file if
      # the embedded issuer public key doesn't match what's in env, so a
      # secret rotation (or the legacy flat-users config from STA-3227)
      # flows through without a manual cleanup of the PVC.
      - name: bootstrap-nats-config
        image: {{ .Values.tactical.base.waitRedisImage.registry }}/{{ .Values.tactical.base.waitRedisImage.repository }}:{{ .Values.tactical.base.waitRedisImage.tag }}
        command:
        - sh
        - -c
        - |
          set -eu
          target=/mnt/nats-data/nats-rmm.conf

          if [ -z "${AUTH_ISSUER_PUBLIC:-}" ] || [ -z "${AUTH_SERVICE_PASS:-}" ]; then
            echo "ERROR: AUTH_ISSUER_PUBLIC / AUTH_SERVICE_PASS must come from tactical-nats-auth Secret" >&2
            exit 1
          fi

          # Idempotency by content: if the existing file already references
          # the current issuer public key AND has the auth_callout block,
          # nothing to do. Otherwise rewrite — that catches both the
          # STA-3227 flat-users config and a future secret rotation.
          if [ -s "$target" ] \
             && grep -q '"auth_callout"' "$target" \
             && grep -q "\"$AUTH_ISSUER_PUBLIC\"" "$target"; then
            echo "$target already current ($(wc -c < "$target") bytes), skipping bootstrap"
            exit 0
          fi

          # Layout matches flamingo-stack/tacticalrmm
          # nats-listener/DESIGN_LAYER3_AUTH_CALLOUT.md and what the chart's
          # tactical-nats container expects via env (AUTH_TARGET_ACCOUNT,
          # AUTH_ISSUER_SEED, AUTH_SERVICE_PASS).
          #
          # AUTH:  hosts the auth-service user that nats-api connects as.
          # TRMM:  the target account agents + the tacticalrmm superuser land
          #        in after callout approval (matches AUTH_TARGET_ACCOUNT).
          # SYS:   nats-server's system account (event subjects, monitoring).
          #
          # File mode 0644 because nats-server runs as the image's non-root
          # user and needs read access. AUTH_SERVICE_PASS is no more
          # sensitive on the PVC than SECRET_KEY already was — both already
          # live in K8s Secrets on the same namespace.
          umask 0133
          cat > "$target" <<EOF
          {
            "accounts": {
              "AUTH": {
                "users": [
                  {"user": "auth-service", "password": "${AUTH_SERVICE_PASS}"}
                ]
              },
              "TRMM": {},
              "SYS": {}
            },
            "authorization": {
              "auth_callout": {
                "issuer": "${AUTH_ISSUER_PUBLIC}",
                "auth_users": ["auth-service"],
                "account": "AUTH"
              }
            },
            "system_account": "SYS",
            "max_payload": 67108864,
            "host": "0.0.0.0",
            "port": 4222,
            "websocket": {
              "host": "0.0.0.0",
              "port": 9235,
              "no_tls": true
            }
          }
          EOF
          echo "Wrote $(wc -c < "$target") bytes to $target (mode $(stat -c %a "$target"))"
        env:
        - name: AUTH_ISSUER_PUBLIC
          valueFrom:
            secretKeyRef:
              name: tactical-nats-auth
              key: AUTH_ISSUER_PUBLIC
        - name: AUTH_SERVICE_PASS
          valueFrom:
            secretKeyRef:
              name: tactical-nats-auth
              key: AUTH_SERVICE_PASS
        volumeMounts:
        - name: nats-data
          mountPath: /mnt/nats-data

      containers:
      # tactical-nats is its own dedicated image (nats-server + the Go nats-api
      # binary under supervisord). The base tactical image's entrypoint only
      # knows the backend/celery/celerybeat/websockets roles and aborts with
      # "ERROR: unknown entrypoint role: tactical-nats" if used here.
      - name: tactical-nats
        image: "{{ .Values.tactical.base.natsImage.registry }}/{{ .Values.tactical.base.natsImage.repository }}:{{ .Values.tactical.base.natsImage.tag }}"
        ports:
        - containerPort: 9235
        - containerPort: 4222
        env:
        # nats-api hard-aborts at startup with "SECRET_KEY is required when
        # running without a config file" if SECRET_KEY isn't in env (it uses
        # the key to validate incoming auth callouts against the Postgres
        # users table). Source the same Secret the workers consume so all
        # four pods share one rotation point.
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tactical-secret
              key: SECRET_KEY
        # nats-api in 0.0.23 always starts the Layer 3 auth callout
        # subscriber; the broker config (bootstrap-nats-config init above)
        # defines an AUTH account that callout-approved users get routed
        # into. AUTH_TARGET_ACCOUNT names the account agents + the
        # tacticalrmm superuser land in after approval — must match an
        # account block in nats-rmm.conf. See
        # https://github.com/flamingo-stack/tacticalrmm/blob/master/nats-listener/authcallout.go
        - name: AUTH_TARGET_ACCOUNT
          value: "TRMM"
        envFrom:
        - configMapRef:
            name: tactical-default
        - configMapRef:
            name: tactical-postgres
        - configMapRef:
            name: tactical-redis
        - secretRef:
            name: tactical-postgres
        # Supplies AUTH_ISSUER_SEED (Ed25519 NKey account seed used to sign
        # UserClaims JWTs), AUTH_ISSUER_PUBLIC (public key embedded in
        # nats-rmm.conf as the auth_callout.issuer — kept in the Secret as
        # the operator-facing record of the matching public half), and
        # AUTH_SERVICE_PASS (password for the auth-service user in the
        # broker's AUTH account). Generated once during STA-3228 bring-up;
        # rotating any of these requires a coordinated rolling restart of
        # tactical-nats (broker reloads issuer) followed by anyone that
        # holds the secret.
        - secretRef:
            name: tactical-nats-auth
        # The dedicated tactical-nats image never writes the shared tactical.ready
        # marker. Probe the NATS client port directly — supervisord exposes it as
        # soon as nats-server comes up.
        livenessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 5
          periodSeconds: 5

        volumeMounts:
        - name: nats-data
          mountPath: /opt/tactical
      volumes:
      - name: nats-data
        persistentVolumeClaim:
          claimName: tactical-nats
